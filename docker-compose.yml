services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_NAME: "CCA Portal"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cca_portal
      DB_USERNAME: cca
      DB_PASSWORD: secret
      DB_SSLMODE: prefer
      RUN_MIGRATIONS: "true"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cca_portal
      POSTGRES_USER: cca
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cca -d cca_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
